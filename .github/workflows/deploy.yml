name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options: [staging, prod]

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ── Determine target environment ────────────────────────────────────────────

  set-env:
    name: Set Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

  # ── Build and push images ───────────────────────────────────────────────────

  publish:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: set-env
    environment: ${{ needs.set-env.outputs.environment }}

    outputs:
      api-image: ${{ steps.meta-api.outputs.tags }}
      worker-image: ${{ steps.meta-worker.outputs.tags }}
      image-tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.ACR_LOGIN_SERVER }}/api
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Docker metadata (Worker)
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.ACR_LOGIN_SERVER }}/worker
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/ThreatModelingAgent.Api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=registry,ref=${{ vars.ACR_LOGIN_SERVER }}/api:cache
          cache-to: type=registry,ref=${{ vars.ACR_LOGIN_SERVER }}/api:cache,mode=max

      - name: Build and push Worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/ThreatModelingAgent.Worker/Dockerfile
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=registry,ref=${{ vars.ACR_LOGIN_SERVER }}/worker:cache
          cache-to: type=registry,ref=${{ vars.ACR_LOGIN_SERVER }}/worker:cache,mode=max

  # ── Deploy infrastructure (idempotent) ─────────────────────────────────────

  infra:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: [set-env, publish]
    environment: ${{ needs.set-env.outputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep
        uses: azure/arm-deploy@v2
        with:
          scope: subscription
          region: swedencentral
          template: infra/main.bicep
          parameters: >
            environmentName=${{ needs.set-env.outputs.environment }}
            workosClientId=${{ secrets.WORKOS_CLIENT_ID }}
            workosApiKey=${{ secrets.WORKOS_API_KEY }}
            anthropicApiKey=${{ secrets.ANTHROPIC_API_KEY }}
            azureOpenAiResourceName=${{ vars.AZURE_OPENAI_RESOURCE_NAME }}
            pgAdminLogin=${{ secrets.PG_ADMIN_LOGIN }}
            pgAdminPassword=${{ secrets.PG_ADMIN_PASSWORD }}

  # ── Run database migrations ─────────────────────────────────────────────────

  migrate:
    name: Database Migrations
    runs-on: ubuntu-latest
    needs: [set-env, infra]
    environment: ${{ needs.set-env.outputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install EF tools
        run: dotnet tool install --global dotnet-ef

      - name: Run migrations
        run: |
          dotnet ef database update \
            --project src/ThreatModelingAgent.Infrastructure \
            --startup-project src/ThreatModelingAgent.Api \
            --no-build
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.DATABASE_CONNECTION_STRING }}

  # ── Update Container App revisions ─────────────────────────────────────────

  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: [set-env, publish, migrate]
    environment: ${{ needs.set-env.outputs.environment }}

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update API Container App
        run: |
          az containerapp update \
            --name tma-${{ needs.set-env.outputs.environment }}-api \
            --resource-group tma-${{ needs.set-env.outputs.environment }}-rg \
            --image ${{ vars.ACR_LOGIN_SERVER }}/api:sha-${GITHUB_SHA::8}

  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    needs: [set-env, publish, migrate]
    environment: ${{ needs.set-env.outputs.environment }}

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update Worker Container App
        run: |
          az containerapp update \
            --name tma-${{ needs.set-env.outputs.environment }}-worker \
            --resource-group tma-${{ needs.set-env.outputs.environment }}-rg \
            --image ${{ vars.ACR_LOGIN_SERVER }}/worker:sha-${GITHUB_SHA::8}

  # ── Post-deploy smoke test ──────────────────────────────────────────────────
  # Resolves the live API and frontend URLs from Azure, then polls each until
  # it returns HTTP 200 (up to 60 s). Fails the pipeline if either times out.

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [set-env, deploy-api, deploy-worker]
    environment: ${{ needs.set-env.outputs.environment }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve URLs from Azure
        id: urls
        run: |
          ENV=${{ needs.set-env.outputs.environment }}
          RG="tma-${ENV}-rg"

          API_FQDN=$(az containerapp show \
            --name "tma-${ENV}-api" \
            --resource-group "$RG" \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)
          echo "api_url=https://${API_FQDN}" >> "$GITHUB_OUTPUT"

          SWA_HOSTNAME=$(az staticwebapp show \
            --name "tma-${ENV}-swa" \
            --resource-group "$RG" \
            --query "properties.defaultHostname" \
            --output tsv)
          echo "swa_url=https://${SWA_HOSTNAME}" >> "$GITHUB_OUTPUT"

      - name: Wait for API health
        run: |
          URL="${{ steps.urls.outputs.api_url }}/health"
          echo "Checking API health at $URL"
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" --max-time 10 || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then echo "API is healthy."; exit 0; fi
            sleep 5
          done
          echo "API health check failed after 60 s."; exit 1

      - name: Wait for frontend
        run: |
          URL="${{ steps.urls.outputs.swa_url }}"
          echo "Checking frontend at $URL"
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" --max-time 10 || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then echo "Frontend is reachable."; exit 0; fi
            sleep 5
          done
          echo "Frontend health check failed after 60 s."; exit 1
