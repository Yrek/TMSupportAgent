version: "3.9"

services:
  frontend:
    profiles: ["frontend"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://host.docker.internal:5240/v1}
        VITE_WORKOS_CLIENT_ID: ${VITE_WORKOS_CLIENT_ID:-client_localdev}
        VITE_WORKOS_REDIRECT_URI: ${VITE_WORKOS_REDIRECT_URI:-http://localhost:4173/auth/callback}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_APPINSIGHTS_CONNECTION_STRING: ${VITE_APPINSIGHTS_CONNECTION_STRING:-}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-local}
    container_name: tma-frontend
    restart: unless-stopped
    ports:
      - "4173:80"

  postgres:
    image: postgres:16-alpine
    container_name: tma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: threatmodeling_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: tma-azurite
    restart: unless-stopped
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --loose --skipApiVersionCheck
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data:/data

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tma-sqledge
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LocalDev!23"
    volumes:
      - sqledge_data:/var/opt/mssql
    networks:
      - sb-emulator

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: tma-servicebus
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LocalDev!23"
      SQL_SERVER: "mssql"
      EMULATOR_HTTP_PORT: "5300"
      SQL_WAIT_INTERVAL: "30"
    ports:
      - "5672:5672"
      - "5300:5300"
    volumes:
      - ./infra/local/servicebus-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    depends_on:
      - mssql
    networks:
      - sb-emulator

networks:
  sb-emulator:

volumes:
  postgres_data:
  azurite_data:
  sqledge_data:
